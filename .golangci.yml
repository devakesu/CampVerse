# Enterprise Grade GolangCI-Lint Configuration (Root / Monorepo)
# ==============================================================================
# Comprehensive, high-strictness linter configuration for production Go code
# ==============================================================================

run:
  concurrency: 4
  timeout: 5m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
    settings:
      shadow:
        strict: true

  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104

  revive:
    ignore-generated-header: true
    severity: error
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unreachable-code
      - name: redefines-builtin-id

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - opinionated
    disabled-checks:
      - hugeParam
      - unnamedResult

  errorlint:
    errorf: true
    asserts: true
    comparison: true

  nilerr:
    checked-types:
      - "fs.PathError"
      - "os.PathError"

  gofumpt:
    extra-rules: true

  prealloc:
    simple: true
    range-loops: true
    for-loops: true

  cyclop:
    max-complexity: 15
    package-average: 10.0

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  nolintlint:
    allow-unused: false
    require-explanation: true
    require-specific: true

linters:
  disable-all: true
  enable:
    # Core & Bug Prevention
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - typecheck
    - unused

    # Security & Vulnerabilities
    - gosec

    # Code Quality & Clean Architecture
    - revive
    - gocritic
    - errorlint
    - nilerr
    - nilnil
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - durationcheck
    - makezero
    - predeclared
    - reassign
    - unconvert
    - unparam
    - wastedassign

    # Performance
    - prealloc

    # Complexity & Maintainability
    - cyclop
    - goconst
    - nakedret

    # Formatting, Imports & Style
    - gofumpt
    - goimports
    - whitespace
    - misspell
    - nolintlint

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
